<!doctype html>
<html lang="en">
<head>

body{margin:0;-webkit-font-smoothing:antialiased}
a{color:#B4500C}a:hover{color:#8F3F0A}

      <span style="font-size: 13px; color: var(--muted)">Thu 29 Oct · 14:32 SAST</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">

    </section>

    </sc-for>
  </nav>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay)"></div>
    <aside role="dialog" aria-modal="true" aria-label="Menu" style="position: absolute; top: 0; bottom: 0; left: 0; width: 300px; box-sizing: border-box; background: var(--side); color: var(--sidetext); padding: 12px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 4px 4px 14px">
        <span style="width: 36px; height: 36px; border-radius: 14px; background: var(--accent); color: var(--onaccent); display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 700">T&amp;T</span>
        <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 15px; font-weight: 700">Trailers &amp; Tankers</span><span style="font-size: 12px; color: var(--sidemuted)">Zanele D. · Admin</span></span>

      </div>
      <sc-for list="{{menu}}" as="m" hint-placeholder-count="10">
        <a href="{{m.href}}" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; border-radius: 999px; text-decoration: none; font-size: 15px; font-weight: 500; {{m.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg>{{m.label}}</a>
      </sc-for>
      <button onClick="{{toggleTheme}}" style="margin-top: auto; height: 48px; border-radius: 999px; border: 1px solid var(--sideborder); background: transparent; color: var(--sidetext); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{themeLabel}}</button>
    </aside>
  </sc-if>
</div>
</x-dc>
