<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inspector checklist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;-webkit-font-smoothing:antialiased}
a{color:#B4500C}a:hover{color:#8F3F0A}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #C25A12;outline-offset:2px}
</style>
</helmet>
<div style="{{tv}}; width: 390px; min-height: 2000px; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <header style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: var(--side); color: var(--sidetext)">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--onaccent); display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; font-weight: 700">T&amp;T</span>
      <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.25"><span style="font-size: 15px; font-weight: 700">Trailer Inspection</span><span style="font-size: 12px; color: var(--sidemuted)">Inspector link · expires in 6 days</span></span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--sidemuted)"><span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.1); color: var(--sidetext); font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 50%; background: #F2CF5B"></span>Incomplete · saved 14:32</span><span>{{done}} of 14 checked</span></div>
  </header>

  <main style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <sc-if value="{{tried}}" hint-placeholder-val="{{ false }}">
      <div role="alert" style="padding: 12px 14px; border-radius: 12px; background: var(--redb); color: var(--redt); font-size: 14px; font-weight: 600">{{missing}} item(s) need Pass or Fail before you can submit.</div>
    </sc-if>
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="pi-vin" style="font-size: 14px; font-weight: 600">VIN <span style="color: var(--red)">*</span></label>
      <div style="display: flex; gap: 8px"><input id="pi-vin" value="TT9DEMO24D0010482" style="flex: 1; min-width: 0; height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--strong); background: var(--surface); color: var(--text); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 15px"><button aria-label="Scan VIN plate with camera" style="width: 48px; height: 48px; border-radius: 999px; border: 1px solid var(--strong); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 10a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"></path></svg></button></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="pi-d1" style="font-size: 14px; font-weight: 600">1st inspection</label><input id="pi-d1" value="27/10/2026" style="height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--strong); background: var(--surface); color: var(--text); font: inherit; font-size: 16px; min-width: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><label for="pi-d2" style="font-size: 14px; font-weight: 600">Inspection date</label><input id="pi-d2" value="29/10/2026" style="height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--strong); background: var(--surface); color: var(--text); font: inherit; font-size: 16px; min-width: 0"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="pi-by" style="font-size: 14px; font-weight: 600">Inspected by <span style="color: var(--red)">*</span></label><input id="pi-by" value="Inspector A. Demo" style="height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--strong); background: var(--surface); color: var(--text); font: inherit; font-size: 16px"></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><label for="pi-em" style="font-size: 14px; font-weight: 600">Inspector email <span style="color: var(--red)">*</span></label><input id="pi-em" type="email" value="inspector.a@example.com" style="height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--strong); background: var(--surface); color: var(--text); font: inherit; font-size: 16px"></div>

    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 8px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted)">{{sec.name}}</h2>
        <sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: var(--surface); {{r.card}}">
            <span style="font-size: 15px; font-weight: 600">{{r.label}}</span>
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
              <button role="checkbox" aria-checked="{{r.passA}}" onClick="{{r.togglePass}}" style="height: 48px; border-radius: 14px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; {{r.passStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>Pass</button>
              <button role="checkbox" aria-checked="{{r.failA}}" onClick="{{r.toggleFail}}" style="height: 48px; border-radius: 14px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; {{r.failStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>Fail</button>
            </div>
            <sc-if value="{{r.fail}}" hint-placeholder-val="{{ false }}">
              <button style="height: 44px; border-radius: 14px; border: 1px dashed var(--strong); background: var(--surface2); color: var(--text); font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 10a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"></path></svg>Add photo of fault</button>
            </sc-if>
            <sc-if value="{{r.err}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 600; color: var(--redt)">Mark Pass or Fail.</span></sc-if>
          </div>
        </sc-for>
      </section>
    </sc-for>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 14px; font-weight: 600">Inspector signature <span style="color: var(--red)">*</span></span>
      <button onClick="{{sign}}" aria-label="{{signAria}}" style="position: relative; height: 140px; border-radius: 16px; border: 1px dashed var(--strong); background: var(--surface); color: var(--text); padding: 0; display: flex; align-items: center; justify-content: center; cursor: crosshair">
        <sc-if value="{{signed}}" hint-placeholder-val="{{ false }}"><svg width="220" height="70" viewBox="0 0 260 90" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 58c22-24 34-40 44-36 10 4-10 40 2 40s20-30 34-30 0 26 14 26 26-30 40-28 2 22 14 22 28-14 44-18 24-4 40-6"></path></svg></sc-if>
        <sc-if value="{{unsigned}}" hint-placeholder-val="{{ true }}"><span style="font-size: 15px; color: var(--muted)">Tap to sign</span></sc-if>
        <span style="position: absolute; left: 16px; right: 16px; bottom: 26px; border-bottom: 1px solid var(--strong)"></span>
      </button>
    </div>
  </main>

  <footer style="position: sticky; bottom: 0; display: flex; gap: 10px; padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--border)">
    <button style="flex: 1; height: 52px; border-radius: 999px; border: 1px solid var(--strong); background: var(--surface); color: var(--text); font: inherit; font-size: 16px; font-weight: 600">Save draft</button>
    <button onClick="{{submit}}" style="flex: 2; height: 52px; border-radius: 999px; border: 0; background: var(--accent); color: var(--onaccent); font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Submit inspection</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":2000}}'>
class Component extends DCLogic {
  themeVars(d) {
    const L = { bg:'#F6F7F9', surface:'#FFFFFF', surface2:'#F2F4F7', border:'#E4E7EC', strong:'#C4CAD4', text:'#101828', muted:'#475467', subtle:'#5D6679', accent:'#F47B20', onaccent:'#17181A', accentsoft:'#FFF1E6', accenttext:'#B4500C', side:'#1C1D21', sideborder:'#2C2E33', sidetext:'#F4F4F5', sidemuted:'#B0B4BC', sideactive:'#2F3137', grayb:'#ECEEF2', grayt:'#3F4652', tealb:'#DBF3F1', tealt:'#0B6560', yelb:'#FBF0C4', yelt:'#6E5100', grnb:'#DCF2E3', grnt:'#16613A', redb:'#FDE2DF', redt:'#B42318', red:'#D92D20', cardshadow:'0 1px 2px rgba(16,24,40,.04), 0 2px 8px rgba(16,24,40,.05)', shadow:'0 4px 8px rgba(16,24,40,.04), 0 20px 40px rgba(16,24,40,.14)', overlay:'rgba(16,18,24,.45)' };
    const D = { bg:'#0B0D12', surface:'#14171E', surface2:'#1D2129', border:'#2A2F39', strong:'#3A404C', text:'#ECEEF2', muted:'#A9AFBB', subtle:'#8F96A3', accent:'#FF8A3D', onaccent:'#17181A', accentsoft:'#3A2210', accenttext:'#FFA466', side:'#101114', sideborder:'#23252A', sidetext:'#ECEEF2', sidemuted:'#A2A6AE', sideactive:'#26282D', grayb:'#262A33', grayt:'#C5CAD3', tealb:'#0F302E', tealt:'#5FD3C9', yelb:'#3A3010', yelt:'#F2CF5B', grnb:'#12301F', grnt:'#6DD596', redb:'#3D1714', redt:'#FF8A80', red:'#C93A2E', cardshadow:'0 1px 2px rgba(0,0,0,.35)', shadow:'0 12px 32px rgba(0,0,0,.5)', overlay:'rgba(0,0,0,.6)' };
    const t = d ? D : L;
    return Object.keys(t).map(k => '--' + k + ':' + t[k]).join(';');
  }
  renderVals() {
    const s = this.state || {};
    const dark = !!this.props.dark;
    const init = { a1: 'p', a2: 'p', a3: 'p', a4: 'p', b1: 'p', b2: 'f', b3: 'p', b4: '', c1: 'p', c2: 'p', c3: 'f', c4: '', d1: 'p', d2: 'p' };
    const v = s.v || init;
    const tried = !!s.tried;
    const signed = s.signed != null ? s.signed : false;
    const defs = [
      ['Chassis & running gear', [['a1', 'Axles & hubs'], ['a2', 'Suspension & airbags'], ['a3', 'Brakes & brake lines'], ['a4', 'Tyres, rims & wheel nuts']]],
      ['Lighting & electrical', [['b1', 'Brake lights & indicators'], ['b2', 'Side marker lamps'], ['b3', 'Reflectors & chevrons'], ['b4', 'ABS harness & plug']]],
      ['Tank & fittings', [['c1', 'Manhole lids & seals'], ['c2', 'Valves & API couplers'], ['c3', 'Earth reel & bonding'], ['c4', 'Pressure test']]],
      ['Plates', [['d1', 'VIN plate matches'], ['d2', 'Compliance plates fitted']]]
    ];
    const has = (k, x) => (v[k] || '').indexOf(x) >= 0;
    const flip = (k, x) => { const cur = v[k] || ''; const next = has(k, x) ? cur.replace(x, '') : cur + x; this.setState({ v: { ...v, [k]: next } }); };
    const missing = Object.keys(init).filter(k => !v[k]).length;
    const on = { p: 'border: 2px solid var(--grnt); background: var(--grnb); color: var(--grnt)', f: 'border: 2px solid var(--red); background: var(--redb); color: var(--redt)' };
    const off = 'border: 1px solid var(--strong); background: var(--surface); color: var(--text)';
    return {
      tv: this.themeVars(dark),
      done: 14 - missing, missing: missing, tried: tried && missing > 0,
      sections: defs.map(([name, rows]) => ({ name, rows: rows.map(([k, label]) => {
        const p = has(k, 'p'), f = has(k, 'f'), err = tried && !p && !f;
        return { label, fail: f, err, passA: p ? 'true' : 'false', failA: f ? 'true' : 'false',
          passStyle: p ? on.p : off, failStyle: f ? on.f : off,
          card: err ? 'border: 2px solid var(--red)' : 'border: 1px solid var(--border)',
          togglePass: () => flip(k, 'p'), toggleFail: () => flip(k, 'f') };
      }) })),
      signed: signed, unsigned: !signed, signAria: signed ? 'Signature captured' : 'Signature pad, tap to sign',
      sign: () => this.setState({ signed: true }),
      submit: () => this.setState({ tried: true })
    };
  }
}
</script>
</body>
</html>
