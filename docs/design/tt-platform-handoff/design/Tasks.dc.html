<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;-webkit-font-smoothing:antialiased}
a{color:#B4500C}a:hover{color:#8F3F0A}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #C25A12;outline-offset:2px}
.search:focus-within{outline:2px solid #C25A12;outline-offset:1px}
</style>
</helmet>
<div style="{{tv}}; min-height: 100vh; display: flex; flex-wrap: wrap; background: var(--bg); color: var(--text); font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif">

  <aside aria-label="Main navigation" style="flex: 1 1 232px; min-width: 0; box-sizing: border-box; background: var(--side); border-right: 1px solid var(--sideborder); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px">
    <a href="Home.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; text-decoration: none; color: var(--sidetext)">
      <span style="width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--onaccent); display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 600">T&amp;T</span>
      <span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 14px; font-weight: 600">Trailers &amp; Tankers</span><span style="font-size: 12px; color: var(--sidemuted)">Operations portal</span></span>
    </a>
    <nav style="display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="10">
        <a href="{{n.href}}" aria-current="{{n.current}}" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: 999px; text-decoration: none; font-size: 14px; {{n.style}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>
          <span style="flex: 1">{{n.label}}</span>
          <sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: var(--red); color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{n.badge}}</span></sc-if>
        </a>
      </sc-for>
    </nav>
    <div style="margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--sideborder); display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--sidemuted)">
      <span style="display: flex; align-items: center; gap: 6px; color: var(--sidetext); font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3CCB7F"></span>Xero connected</span>
      <span>Synced 2 min ago · 14:30 SAST</span>
    </div>
  </aside>

  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 11px 28px; border-bottom: 1px solid var(--border); background: var(--surface)">
      <label class="search" style="flex: 1 1 280px; max-width: 560px; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 12px; background: var(--surface2); color: var(--muted)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"></path></svg>
        <input aria-label="Search by quote no, VIN or invoice no" placeholder="Search quote no, VIN or invoice no" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 14px; color: var(--text); outline: none">
        <kbd style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; padding: 1px 6px; border: 1px solid var(--strong); border-radius: 6px; color: var(--muted)">/</kbd>
      </label>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 6px">
        <button aria-label="{{themeAria}}" onClick="{{toggleTheme}}" style="width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{themeIcon}}"></path></svg></button>
        <button aria-haspopup="menu" aria-label="User menu, Zanele D., Admin" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 8px 0 4px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; cursor: pointer">
          <span style="width: 30px; height: 30px; border-radius: 10px; background: var(--accentsoft); color: var(--accenttext); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">ZD</span>
          <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2"><span style="font-size: 13px; font-weight: 600">Zanele D.</span><span style="font-size: 11px; color: var(--muted)">Admin · Durban</span></span>
        </button>
      </div>
    </header>

    <main style="padding: 24px 28px 40px; display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 1360px; box-sizing: border-box">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.02em">Tasks</h1>
        <span style="font-size: 13px; color: var(--muted)">Things waiting on you. Oldest first.</span>
      </div>

      <div role="tablist" aria-label="Filter tasks" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
          <button role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; {{f.style}}">{{f.label}}<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 500">{{f.n}}</span></button>
        </sc-for>
      </div>

      <section style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--cardshadow)">
        <ul style="list-style: none; margin: 0; padding: 0">
          <sc-for list="{{rows}}" as="t" hint-placeholder-count="7">
            <li style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 16px; border-top: 1px solid var(--border)">
              <span style="width: 36px; height: 36px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center; {{t.tone}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg></span>
              <span style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><a href="{{t.href}}" style="font-size: 15px; font-weight: 600; color: var(--text); text-decoration: none">{{t.title}}</a><span style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600; {{t.tone}}"><span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor"></span>{{t.status}}</span></span>
                <span style="font-size: 13px; color: var(--muted)">{{t.meta}}</span>
              </span>
              <span style="flex: none; font-size: 13px; color: var(--muted); width: 110px">{{t.age}}</span>
              <span style="flex: none; display: flex; gap: 8px">
                <sc-if value="{{t.hasSecondary}}" hint-placeholder-val="{{ true }}"><a href="{{t.href}}" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--strong); color: var(--text); text-decoration: none; font-size: 13px; font-weight: 500">{{t.secondary}}</a></sc-if>
                <button onClick="{{t.act}}" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 0; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; {{t.btn}}">{{t.primary}}</button>
              </span>
            </li>
          </sc-for>
        </ul>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1120}}'>
class Component extends DCLogic {
  themeVars(d) {
    const L = { bg:'#F6F7F9', surface:'#FFFFFF', surface2:'#F2F4F7', border:'#E4E7EC', strong:'#C4CAD4', text:'#101828', muted:'#475467', subtle:'#5D6679', accent:'#F47B20', onaccent:'#17181A', accentsoft:'#FFF1E6', accenttext:'#B4500C', side:'#1C1D21', sideborder:'#2C2E33', sidetext:'#F4F4F5', sidemuted:'#B0B4BC', sideactive:'#2F3137', grayb:'#ECEEF2', grayt:'#3F4652', tealb:'#DBF3F1', tealt:'#0B6560', yelb:'#FBF0C4', yelt:'#6E5100', grnb:'#DCF2E3', grnt:'#16613A', redb:'#FDE2DF', redt:'#B42318', red:'#D92D20', cardshadow:'0 1px 2px rgba(16,24,40,.04), 0 2px 8px rgba(16,24,40,.05)', shadow:'0 4px 8px rgba(16,24,40,.04), 0 20px 40px rgba(16,24,40,.14)', overlay:'rgba(16,18,24,.45)' };
    const D = { bg:'#0B0D12', surface:'#14171E', surface2:'#1D2129', border:'#2A2F39', strong:'#3A404C', text:'#ECEEF2', muted:'#A9AFBB', subtle:'#8F96A3', accent:'#FF8A3D', onaccent:'#17181A', accentsoft:'#3A2210', accenttext:'#FFA466', side:'#101114', sideborder:'#23252A', sidetext:'#ECEEF2', sidemuted:'#A2A6AE', sideactive:'#26282D', grayb:'#262A33', grayt:'#C5CAD3', tealb:'#0F302E', tealt:'#5FD3C9', yelb:'#3A3010', yelt:'#F2CF5B', grnb:'#12301F', grnt:'#6DD596', redb:'#3D1714', redt:'#FF8A80', red:'#C93A2E', cardshadow:'0 1px 2px rgba(0,0,0,.35)', shadow:'0 12px 32px rgba(0,0,0,.5)', overlay:'rgba(0,0,0,.6)' };
    const t = d ? D : L;
    return Object.keys(t).map(k => '--' + k + ':' + t[k]).join(';');
  }
  nav(active) {
    const I = { home:'M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z', tasks:'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11', forms:'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5', deals:'M3 7h18v13H3zM8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18', quotes:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6', invoices:'M4 4h16v16H4zM4 9h16M9 9v11', documents:'M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z', leads:'M3 13l3-9h12l3 9M3 13v6h18v-6M3 13h5l1 3h6l1-3h5', integrations:'M9 3v5M15 3v5M6 8h12v4a6 6 0 0 1-12 0zM12 18v3', settings:'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4' };
    const items = [['Home','home','Home.dc.html'],['Tasks','tasks','Tasks.dc.html',5],['Forms','forms','FormsIndex.dc.html'],['Deals','deals','DealFile.dc.html'],['Quotes','quotes','XeroMirror.dc.html'],['Invoices','invoices','XeroMirror.dc.html'],['Documents','documents','Entries.dc.html'],['Leads','leads','Leads.dc.html',2],['Integrations','integrations','XeroIntegration.dc.html'],['Settings','settings','Settings.dc.html']];
    return items.map(([label, ic, href, badge]) => ({ label, d: I[ic], href, badge: badge || '', hasBadge: !!badge, current: label === active ? 'page' : 'false', style: label === active ? 'background: var(--sideactive); color: #FFFFFF; font-weight: 600' : 'color: var(--sidemuted)' }));
  }
  renderVals() {
    const s = this.state || {};
    const dark = s.dark != null ? s.dark : !!this.props.dark;
    const filter = s.filter || 'All';
    const doneSet = s.done || {};
    const tone = { gray:'background: var(--grayb); color: var(--grayt)', teal:'background: var(--tealb); color: var(--tealt)', yel:'background: var(--yelb); color: var(--yelt)', grn:'background: var(--grnb); color: var(--grnt)', red:'background: var(--redb); color: var(--redt)' };
    const ic = { insp:'M9 11l2 2 4-4M4 4h16v16H4z', store:'M3 8l9-5 9 5v12H3zM8 20v-6h8v6M3 8h18', job:'M12 3 2 20h20zM12 10v4M12 17.5v.01', lead:'M3 13l3-9h12l3 9M3 13v6h18v-6M3 13h5l1 3h6l1-3h5' };
    const all = [
      { id: 'a', cat: 'Inspections', icon: ic.insp, title: 'Inspection #214 · TT9DEMO24D0010482', status: 'Submitted', tone: tone.teal, meta: 'Needs review · Inspector A. Demo · 2 rows marked Fail', age: 'Today 09:14', secondary: 'Open', primary: 'Mark reviewed', href: 'EntryDetail.dc.html' },
      { id: 'b', cat: 'Inspections', icon: ic.insp, title: 'Inspection #211 · TT9DEMO24D0010471', status: 'Submitted', tone: tone.teal, meta: 'Needs review · Inspector B. Sample', age: 'Yesterday 15:40', secondary: 'Open', primary: 'Mark reviewed', href: 'EntryDetail.dc.html' },
      { id: 'c', cat: 'Inspections', icon: ic.insp, title: 'Inspection #209 · TT9DEMO24D0010466', status: 'Reviewed', tone: tone.yel, meta: 'Needs approval · reviewed by Pieter V.', age: 'Yesterday 16:40', secondary: 'Open', primary: 'Approve', href: 'EntryDetail.dc.html' },
      { id: 'd', cat: 'Store Room', icon: ic.store, title: 'Store Room count #61 · Durban', status: 'APPROVAL', tone: tone.red, meta: '6 of 45 items below minimum · counted by Store B. Sample', age: 'Yesterday 16:05', secondary: 'Open', primary: 'Mark APPROVED EMAILED', href: 'StoreRoom.dc.html' },
      { id: 'e', cat: 'Failed jobs', icon: ic.job, title: 'xero.syncInvoices', status: 'Failed', tone: tone.red, meta: '429 Too Many Requests · 3 attempts · run #8812', age: 'Today 13:58', secondary: 'Details', primary: 'Retry', href: 'XeroIntegration.dc.html' },
      { id: 'f', cat: 'Failed jobs', icon: ic.job, title: 'email.sendReleaseForm', status: 'Failed', tone: tone.red, meta: 'Recipient bounced · releases-cpt@example.com · run #8790', age: 'Today 11:20', secondary: 'Details', primary: 'Retry', href: 'Settings.dc.html' },
      { id: 'g', cat: 'Leads', icon: ic.lead, title: 'Lead L-0931 · Karoo Demo Transport', status: 'New', tone: tone.gray, meta: 'Assigned to you · possible duplicate of L-0917', age: '2 days', secondary: '', primary: 'Open lead', href: 'Leads.dc.html' }
    ];
    const live = all.filter(t => !doneSet[t.id]);
    const cats = ['All', 'Inspections', 'Store Room', 'Failed jobs', 'Leads'];
    return {
      tv: this.themeVars(dark),
      themeAria: dark ? 'Switch to light mode' : 'Switch to dark mode',
      themeIcon: dark ? 'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4' : 'M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z',
      toggleTheme: () => this.setState({ dark: !dark }),
      nav: this.nav('Tasks'),
      filters: cats.map(c => ({ label: c, n: c === 'All' ? live.length : live.filter(t => t.cat === c).length, on: c === filter ? 'true' : 'false', style: c === filter ? 'border: 1px solid var(--text); background: var(--text); color: var(--bg)' : 'border: 1px solid var(--border); background: var(--surface); color: var(--text)', pick: () => this.setState({ filter: c }) })),
      rows: live.filter(t => filter === 'All' || t.cat === filter).map(t => ({ ...t, hasSecondary: !!t.secondary,
        btn: t.cat === 'Failed jobs' ? 'background: var(--surface2); color: var(--text); border: 1px solid var(--strong)' : 'background: var(--accent); color: var(--onaccent)',
        act: () => this.setState({ done: { ...doneSet, [t.id]: true } }) }))
    };
  }
}
</script>
</body>
</html>
